<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} — Riya Broker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="/static/shared.css" rel="stylesheet">
<style>
/* ── Broker shell ── */
.shell{display:flex;min-height:100vh}
.sidebar{
  width:220px;flex-shrink:0;background:#0f172a;color:#cbd5e1;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto
}
.sb-brand{padding:20px 16px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-brand-name{font-size:18px;font-weight:800;color:#fff}
.sb-brand-sub{font-size:11px;color:#64748b;margin-top:2px}
.sb-tok{padding:10px 14px;background:rgba(255,255,255,.06);margin:10px 10px 0;
  border-radius:8px;display:flex;align-items:center;gap:8px}
.sb-tok input{background:transparent;border:none;color:#94a3b8;font-size:12px;
  width:100%;outline:none;font-family:inherit}
.sb-tok-icon{font-size:14px;flex-shrink:0}
.sb-nav{padding:10px 0;flex:1}
.sb-section{font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;
  letter-spacing:.08em;padding:12px 16px 4px}
.sb-link{display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:13px;
  font-weight:500;color:#94a3b8;text-decoration:none;transition:all .12s;border-left:3px solid transparent}
.sb-link:hover{background:rgba(255,255,255,.06);color:#e2e8f0}
.sb-link.active{background:rgba(37,99,235,.2);color:#93c5fd;border-left-color:#2563eb;font-weight:600}
.sb-link .ic{width:16px;text-align:center;flex-shrink:0;font-size:14px}
.sb-footer{padding:14px 16px;border-top:1px solid rgba(255,255,255,.06);font-size:11px;color:#475569}
.sb-footer a{color:#475569;text-decoration:none}
.sb-footer a:hover{color:#94a3b8}

/* ── Main content ── */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.main-hdr{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 24px;
  height:56px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.main-title{font-size:17px;font-weight:700;color:#0f172a;flex:1}
.main-body{flex:1;padding:20px 24px;overflow-y:auto}

/* Mobile sidebar toggle */
.mob-toggle{display:none;position:fixed;bottom:20px;right:20px;width:50px;height:50px;
  background:#2563eb;color:#fff;border:none;border-radius:50%;font-size:22px;
  box-shadow:0 4px 16px rgba(37,99,235,.4);cursor:pointer;z-index:200;
  align-items:center;justify-content:center}

@media(max-width:768px){
  .sidebar{position:fixed;left:-220px;top:0;z-index:100;transition:left .25s;height:100%}
  .sidebar.open{left:0}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
  .overlay.show{display:block}
  .mob-toggle{display:flex}
  .main-body{padding:14px 14px}
}
</style>
</head>
<body>
<div id="overlay" class="overlay" onclick="closeSb()"></div>

<div class="shell">
  <nav class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="sb-brand-name">Riya Broker</div>
      <div class="sb-brand-sub">Real Estate Management</div>
    </div>
    <div class="sb-tok">
      <span class="sb-tok-icon">🔑</span>
      <input id="tok-input" type="password" placeholder="Enter broker token" oninput="saveTok(this.value)">
    </div>
    <div class="sb-nav">
      <div class="sb-section">Overview</div>
      <a class="sb-link {{A_DASH}}" href="/broker"><span class="ic">📊</span> Dashboard</a>
      <a class="sb-link {{A_PIPE}}" href="/broker/pipeline"><span class="ic">🎯</span> Pipeline</a>
      <a class="sb-link {{A_ANAL}}" href="/broker/analytics/visual"><span class="ic">📈</span> Analytics</a>
      <div class="sb-section">Visits & Calendar</div>
      <a class="sb-link {{A_MEET}}" href="/broker/meetings"><span class="ic">📅</span> Meetings</a>
      <a class="sb-link" href="https://calendar.google.com" target="_blank"><span class="ic">🗓️</span> Google Calendar ↗</a>
      <div class="sb-section">Properties</div>
      <a class="sb-link {{A_LIST}}" href="/broker/listings"><span class="ic">🏠</span> My Listings</a>
      <a class="sb-link {{A_ADD}}" href="/broker/add"><span class="ic">➕</span> Add Property</a>
      <a class="sb-link {{A_UPL}}" href="/broker/upload"><span class="ic">📤</span> Upload CSV</a>
      <div class="sb-section">Buyers</div>
      <a class="sb-link" href="/properties/browse" target="_blank"><span class="ic">👁️</span> Customer View</a>
      <a class="sb-link" href="/"><span class="ic">💬</span> Chat Preview</a>
    </div>
    <div class="sb-footer">
      <a href="/health" target="_blank">🟢 Server status</a>
    </div>
  </nav>

  <div class="main">
    <div class="main-hdr">
      <button class="btn btn-ghost" style="display:none;padding:6px 10px" id="mob-menu" onclick="openSb()">☰</button>
      <div class="main-title">{{TITLE}}</div>
      <div id="hdr-extra">{{HDR_EXTRA}}</div>
    </div>
    <div class="main-body" id="main-body">
      {{CONTENT}}
    </div>
  </div>
</div>

<button class="mob-toggle" onclick="openSb()">☰</button>

<div id="toast"></div>

<script>
// Shared token handling
function tok(){return localStorage.getItem('btok')||'';}
function saveTok(v){if(v)localStorage.setItem('btok',v);}
window.addEventListener('DOMContentLoaded',()=>{
  const t=tok(); if(t)document.getElementById('tok-input').value=t;
  // mobile menu button
  if(window.innerWidth<=768)document.getElementById('mob-menu').style.display='flex';
});
function openSb(){document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show');}
function closeSb(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
function toast(msg,ok=true){const t=document.getElementById('toast');t.textContent=msg;t.style.background=ok?'#059669':'#dc2626';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}
function fmt(p){if(!p)return'POA';const c=p/1e7;return c>=1?'₹'+c.toFixed(2)+' Cr':'₹'+(p/1e5).toFixed(0)+' L';}
</script>
{{SCRIPTS}}
</body>
</html>
