<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — Riya</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
:root{--ink:#12211b;--soft:#4a5a52;--paper:#f6f4ec;--paper2:#efece1;--emerald:#0f7a52;--emerald-dk:#0b5c3d;--emerald-lt:#e7f3ec;--line:#e3dfd2;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'General Sans',system-ui,sans-serif;color:var(--ink);background:var(--paper);
  min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
body::before{content:'';position:absolute;top:-12%;left:-8%;width:46%;height:80%;background:radial-gradient(circle,rgba(15,122,82,.14),transparent 70%);pointer-events:none}
body::after{content:'';position:absolute;bottom:-16%;right:-8%;width:46%;height:86%;background:radial-gradient(circle,rgba(200,137,42,.12),transparent 70%);pointer-events:none}
.card{position:relative;z-index:1;width:100%;max-width:420px;background:#fff;border-radius:22px;
  padding:38px 34px;box-shadow:0 30px 70px rgba(18,33,27,.16);border:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:24px}
.brand .dot{width:40px;height:40px;border-radius:12px;background:var(--emerald);color:#fff;
  display:flex;align-items:center;justify-content:center;font-family:'Clash Display';font-weight:700;font-size:21px}
.brand .bt{font-family:'Clash Display';font-weight:700;font-size:20px;line-height:1.05}
.brand .bs{font-size:12px;color:var(--soft)}
h1{font-family:'Clash Display';font-size:26px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
.sub{font-size:14.5px;color:var(--soft);margin-bottom:22px}
#gbtn{display:flex;justify-content:center;margin-bottom:16px;min-height:44px}
.divider{display:flex;align-items:center;gap:10px;color:var(--soft);font-size:12.5px;margin:6px 0 16px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
label{display:block;font-size:12.5px;font-weight:600;color:var(--soft);margin:0 0 6px}
.field{position:relative;margin-bottom:12px}
.field i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#9aa79f;font-size:17px}
input{width:100%;padding:12px 13px 12px 40px;border:1.5px solid var(--line);border-radius:12px;
  font-size:15px;font-family:inherit;outline:none;background:var(--paper);transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--emerald);background:#fff;box-shadow:0 0 0 3px rgba(15,122,82,.14)}
#otp{letter-spacing:6px;text-align:center;font-size:18px;padding-left:13px}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--emerald);color:#fff;
  font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 8px 22px rgba(15,122,82,.28);transition:background .15s,transform .12s}
.btn:hover{background:var(--emerald-dk);transform:translateY(-1px)}
.btn:disabled{opacity:.7;cursor:default;transform:none}
.msg{font-size:13px;margin-top:12px;min-height:16px;text-align:center}
.foot{margin-top:20px;text-align:center;font-size:13px;color:var(--soft)}
.foot a{color:var(--emerald);font-weight:600;text-decoration:none}
.skip{margin-top:8px}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="card">
  <div class="brand">
    <span class="dot">R</span>
    <div><div class="bt">Riya</div><div class="bs">Your Lucknow home guide</div></div>
  </div>
  <h1>Welcome back</h1>
  <p class="sub">Sign in to save homes you love and see your booked visits — on any device.</p>

  <div id="gbtn"></div>
  <div class="divider">or with email</div>

  <label for="email">Email</label>
  <div class="field"><i class="ph ph-envelope-simple"></i>
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com" autofocus></div>

  <div id="otp-row" style="display:none">
    <label for="otp">Verification code</label>
    <div class="field"><i class="ph ph-shield-check"></i>
      <input id="otp" inputmode="numeric" maxlength="6" placeholder="6-digit code"></div>
  </div>

  <button class="btn" id="go" onclick="loginAction()"><i class="ph ph-paper-plane-tilt"></i> Send code</button>
  <p class="msg" id="msg"></p>
  <div class="foot">
    <a href="/chat">Continue without signing in →</a>
    <div class="skip"><a href="/" style="color:var(--soft);font-weight:500">← Back to home</a></div>
  </div>
</div>

<script>
var NEXT=new URLSearchParams(location.search).get('next')||'/chat';
if(localStorage.getItem('riya_token')) location.replace(NEXT);

function authHeaders(t){return t?{'Authorization':'Bearer '+t}:{};}
async function onLoggedIn(token){
  localStorage.setItem('riya_token',token);
  // carry over anything saved locally before signing in
  try{
    var ids=JSON.parse(localStorage.getItem('riya_saved')||'[]');
    for(var i=0;i<ids.length;i++){
      await fetch('/me/favourites',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders(token)),body:JSON.stringify({property_id:ids[i]})});
    }
  }catch(e){}
  location.replace(NEXT);
}

var otpSent=false;
async function loginAction(){
  var email=document.getElementById('email').value.trim();
  var msg=document.getElementById('msg'), go=document.getElementById('go');
  if(!email.includes('@')){ msg.style.color='#c0492f'; msg.textContent='Enter a valid email.'; return; }
  if(!otpSent){
    go.disabled=true; msg.style.color='#4a5a52'; msg.textContent='Sending code…';
    try{
      var r=await fetch('/auth/otp/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email})});
      go.disabled=false;
      if((await r.json()).ok){ otpSent=true; document.getElementById('otp-row').style.display='';
        go.innerHTML='<i class="ph ph-sign-in"></i> Verify & sign in'; msg.style.color='#0f7a52';
        msg.textContent='Code sent to '+email+' — check your inbox.'; document.getElementById('otp').focus(); }
      else { msg.style.color='#c0492f'; msg.textContent='Could not send code. Try again.'; }
    }catch(e){ go.disabled=false; msg.style.color='#c0492f'; msg.textContent='Could not connect. Try again.'; }
  } else {
    var code=document.getElementById('otp').value.trim();
    go.disabled=true; msg.style.color='#4a5a52'; msg.textContent='Verifying…';
    try{
      var r=await fetch('/auth/otp/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,code:code})});
      go.disabled=false;
      if(r.ok){ onLoggedIn((await r.json()).token); }
      else { msg.style.color='#c0492f'; msg.textContent='Wrong or expired code.'; }
    }catch(e){ go.disabled=false; msg.style.color='#c0492f'; msg.textContent='Could not connect. Try again.'; }
  }
}
document.getElementById('otp').addEventListener('keydown',function(e){if(e.key==='Enter')loginAction();});
document.getElementById('email').addEventListener('keydown',function(e){if(e.key==='Enter')loginAction();});

async function handleGoogle(resp){
  var msg=document.getElementById('msg');
  try{
    var r=await fetch('/auth/google',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({credential:resp.credential})});
    if(r.ok){ onLoggedIn((await r.json()).token); }
    else { msg.style.color='#c0492f'; msg.textContent='Google sign-in failed.'; }
  }catch(e){ msg.style.color='#c0492f'; msg.textContent='Google sign-in failed.'; }
}
(async function(){
  try{
    var cfg=await (await fetch('/auth/config')).json();
    if(!cfg.google_client_id || !window.google || !google.accounts){ document.getElementById('gbtn').style.display='none'; document.querySelector('.divider').style.display='none'; return; }
    google.accounts.id.initialize({client_id:cfg.google_client_id, callback:handleGoogle});
    google.accounts.id.renderButton(document.getElementById('gbtn'),{theme:'outline',size:'large',width:340,text:'continue_with'});
  }catch(e){ document.getElementById('gbtn').style.display='none'; }
})();
</script>
</body>
</html>
