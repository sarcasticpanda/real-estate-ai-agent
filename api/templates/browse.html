<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browse Properties — Riya Lucknow</title>
<link href="/static/shared.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
.topnav-links i,.btn-ask i,.pcard-pois i{font-size:16px;vertical-align:-2px}
.hero{background:var(--slate-900);color:var(--paper);padding:48px 20px 40px;text-align:center;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 0%,rgba(15,122,82,.35),transparent 55%);pointer-events:none}
.hero h1{font-family:var(--display);font-size:clamp(26px,4vw,40px);font-weight:700;margin-bottom:8px;letter-spacing:-.02em;position:relative}
.hero p{font-size:15px;color:#b7c4bd;position:relative}
.filter-bar{background:var(--white);border-bottom:1px solid var(--slate-200);padding:14px 16px;
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:64px;z-index:50;
  box-shadow:var(--shadow-sm)}
.filter-bar input,.filter-bar select{
  padding:10px 13px;border:1.5px solid var(--slate-200);border-radius:11px;
  font-size:13px;font-family:inherit;outline:none;background:var(--slate-50);
  transition:border-color .15s}
.filter-bar input:focus,.filter-bar select:focus{border-color:var(--brand);background:#fff}
.filter-bar input{width:160px}
.filter-bar select{width:130px;cursor:pointer}
.search-btn{padding:11px 22px;background:var(--brand);color:#fff;border:none;border-radius:11px;
  font-weight:600;font-size:13px;cursor:pointer;transition:all .15s;white-space:nowrap;box-shadow:0 4px 12px rgba(15,122,82,.22)}
.search-btn:hover{background:var(--brand-dk);transform:translateY(-1px)}
#count{color:var(--slate-500);font-size:13px;padding:16px 16px 0;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;padding:16px 16px 40px}
.pcard{background:var(--white);border-radius:var(--radius);overflow:hidden;border:1px solid var(--slate-200);
  box-shadow:var(--shadow-sm);transition:transform .22s,box-shadow .22s;cursor:pointer}
.pcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.pcard-img{height:190px;background:var(--slate-100);overflow:hidden;position:relative}
.pcard-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.pcard:hover .pcard-img img{transform:scale(1.06)}
.pcard-img-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--slate-400);font-size:13px}
.pcard-type-badge{position:absolute;top:10px;right:10px;background:rgba(18,33,27,.62);
  color:#fff;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;backdrop-filter:blur(4px)}
.pcard-body{padding:16px}
.pcard-price{font-family:var(--display);font-size:19px;font-weight:700;color:var(--brand);margin-bottom:4px}
.pcard-title{font-size:14px;font-weight:600;color:var(--slate-900);margin-bottom:3px}
.pcard-loc{font-size:12px;color:var(--slate-500);margin-bottom:10px;display:flex;align-items:center;gap:4px}
.pcard-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pchip{background:var(--slate-100);color:var(--slate-500);border:1px solid var(--slate-200);font-size:11px;font-weight:500;padding:3px 10px;border-radius:9px}
.pchip-green{background:var(--brand-lt);color:var(--brand);border-color:transparent}
.pcard-pois{font-size:12px;color:var(--slate-500);margin-bottom:12px;line-height:1.7}
.pcard-pois span{display:inline-block;margin-right:10px}
.pcard-actions{display:flex;gap:8px}
.btn-ask{flex:1;padding:11px;background:var(--brand);color:#fff;border:none;border-radius:11px;
  font-size:13px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;
  display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s}
.btn-ask:hover{background:var(--brand-dk)}
.empty-state{text-align:center;padding:80px 20px;color:var(--slate-400)}
.empty-state .ei{font-size:48px;margin-bottom:14px}
.empty-state h2{font-family:var(--display);font-size:20px;font-weight:700;color:var(--slate-700);margin-bottom:8px}
.empty-state p{font-size:14px}
.empty-state a{color:var(--brand);font-weight:600;text-decoration:none}
@media(max-width:640px){
  .filter-bar{gap:6px}
  .filter-bar input{width:calc(50% - 3px)}
  .filter-bar select{width:calc(50% - 3px)}
  .grid{grid-template-columns:1fr 1fr;gap:10px;padding:10px 10px 24px}
  .pcard-img{height:140px}
  .hero h1{font-size:20px}
}
@media(max-width:420px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<nav class="topnav">
  <a class="topnav-brand" href="/">Riya</a>
  <div class="topnav-links">
    <a href="/chat"><i class="ph ph-chat-circle-dots"></i> <span>Chat</span></a>
    <a href="/properties/browse" class="active"><i class="ph ph-house-line"></i> <span>Browse</span></a>
    <a href="/broker/login"><i class="ph ph-key"></i> <span>Broker</span></a>
  </div>
</nav>

<div class="hero">
  <h1>Properties in Lucknow</h1>
  <p>Find your perfect home — filter by area, BHK, budget and more</p>
</div>

<div class="filter-bar">
  <input id="area" placeholder="Area e.g. Gomti Nagar">
  <select id="bhk"><option value="">Any BHK</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
  <select id="type"><option value="">Any type</option><option>Flat</option><option>Independent House</option><option>Villa</option><option>Builder Floor</option><option>Plot</option><option>Shop</option></select>
  <input id="min" type="number" placeholder="Min ₹ (lakh)">
  <input id="max" type="number" placeholder="Max ₹ (lakh)">
  <button class="search-btn" onclick="load()">Search</button>
</div>
<div id="count"></div>
<div id="grid" class="grid"></div>

<script>
async function load(){
  const area=document.getElementById('area').value.trim();
  const bhk=document.getElementById('bhk').value;
  const type=document.getElementById('type').value;
  const minL=parseFloat(document.getElementById('min').value)||0;
  const maxL=parseFloat(document.getElementById('max').value)||0;
  let url='/api/properties/browse?limit=60';
  if(area) url+='&area='+encodeURIComponent(area);
  if(bhk) url+='&bhk='+bhk;
  if(type) url+='&prop_type='+encodeURIComponent(type);
  if(minL) url+='&min_price='+Math.round(minL*1e5);
  if(maxL) url+='&max_price='+Math.round(maxL*1e5);
  document.getElementById('count').textContent='Searching…';
  const r=await fetch(url); const d=await r.json();
  const ps=d.properties||[];
  document.getElementById('count').textContent=ps.length+' propert'+(ps.length===1?'y':'ies')+' found';
  const g=document.getElementById('grid');
  if(!ps.length){
    g.innerHTML='<div class="empty-state" style="grid-column:1/-1"><div class="ei"><i class="ph ph-house-line"></i></div><h2>No properties found</h2><p>Try different filters, or <a href="/chat">chat with Riya</a> for personalised recommendations.</p></div>';
    return;
  }
  g.innerHTML='';
  ps.forEach(p=>{
    const c=document.createElement('div'); c.className='pcard';
    const chips=(p.amenities||[]).map(a=>'<span class="pchip">'+a+'</span>').join('');
    const poi=p.metro?'<span><i class="ph ph-train-simple"></i> Metro '+p.metro+' km</span>':'';
    c.innerHTML='<div class="pcard-img">'
      +(p.hero_img?'<img src="'+p.hero_img+'" loading="lazy" onerror="this.parentElement.innerHTML=\'<div class=pcard-img-empty>No photo</div>\'">'
                  :'<div class="pcard-img-empty">No photo yet</div>')
      +'<div class="pcard-type-badge">'+(p.prop_type||'Property')+'</div></div>'
      +'<div class="pcard-body">'
      +'<div class="pcard-price">₹'+(p.price_str||'POA').replace(/Rs\.\s*/,'')+'</div>'
      +'<div class="pcard-title">'+(p.bhk||'')+' BHK · '+(p.sqft?p.sqft+' sqft':'')+(p.furnishing?' · '+p.furnishing:'')+'</div>'
      +'<div class="pcard-loc"><svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>'+(p.area||'Lucknow')+'</div>'
      +(chips?'<div class="pcard-chips">'+chips+'</div>':'')
      +(poi?'<div class="pcard-pois">'+poi+'</div>':'')
      +'<div class="pcard-actions">'
      +'<a class="btn-ask" href="/chat?prop='+encodeURIComponent(p.id)+'&area='+encodeURIComponent(p.area||'')+'&bhk='+(p.bhk||'')+'&price='+encodeURIComponent(p.price_str||'')+'"><i class="ph ph-chat-circle-dots"></i> Ask Riya about this</a>'
      +'</div>'
      +'</div>';
    g.appendChild(c);
  });
}
// Parse ?ask= param to pre-fill chat
const askParam=new URLSearchParams(location.search).get('ask');
if(askParam) { /* handled by chat page */ }
window.onload=load;
document.getElementById('area').addEventListener('keydown',e=>{ if(e.key==='Enter') load(); });
</script>
</body>
</html>
